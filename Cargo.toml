[package]
name = "open-uwsc"
version = "0.1.0"
edition = "2024"

[lib]
name = "open_uwsc"
path = "src/lib.rs"

[dependencies]
chrono = "0.4.44"
image = "0.24"
libloading = "0.9.0"
# eframe = "0.33.3"
# enigo = "0.6.1"
rand = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
screenshots = "0.8.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
headless_chrome = "1.0.15"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_SystemServices",
] }

[[bin]]
name = "debug_capture"
path = "tests/src/debug_capture.rs"

[[bin]]
name = "test_color"
path = "tests/src/test_color.rs"

[[bin]]
name = "check_template"
path = "tests/src/check_template.rs"

[[bin]]
name = "test_chkimg_logic"
path = "tests/src/test_chkimg_logic.rs"

[[bin]]
name = "self_test"
path = "tests/src/self_test.rs"

[features]
experimental = []
